name: Build OS installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 1.1.0); leave blank to rebuild VERSION
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - VERSION

concurrency:
  group: installer-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="$(python packaging/bump_version.py --set "${INPUT_VERSION}" --print-only)"
          else
            VERSION="$(python packaging/bump_version.py --print-only)"
          fi
          TAG="v${VERSION}"
          RELEASE=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping duplicate automatic release"
            RELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release version ${VERSION}: ${RELEASE}"

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install build dependencies
        run: python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item (Get-Command ffmpeg).Source vendor\ffmpeg.exe
          python packaging\build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging\astro_dwarf.spec

      - name: Smoke test application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:ASTRO_DWARF_TEST_EXIT_MS = "3000"
          $process = Start-Process dist\AstroDwarf\AstroDwarf.exe -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Frozen application exited with code $($process.ExitCode)."
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\astro-dwarf.iss

      - name: Package Windows zip archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setupExe = "AstroDwarf-Setup-$env:VERSION-win64.exe"
          if (-not (Test-Path "release\$setupExe")) {
            throw "Installer $setupExe was not produced."
          }
          tar.exe -a -c -f "release\AstroDwarf-Setup-$env:VERSION-win64.zip" -C release $setupExe
          tar.exe -a -c -f "release\AstroDwarf-$env:VERSION-win64-portable.zip" -C dist AstroDwarf
          if (-not (Test-Path "release\AstroDwarf-$env:VERSION-win64-portable.zip")) {
            throw "Portable zip was not produced."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install build dependencies
        run: python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: bash
        run: |
          mkdir -p vendor
          cp "$(command -v ffmpeg)" vendor/ffmpeg
          chmod +x vendor/ffmpeg
          python packaging/build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/astro_dwarf.spec

      - name: Smoke test application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
        run: |
          set -euo pipefail
          APP="dist/AstroDwarf.app/Contents/MacOS/AstroDwarf"
          if [[ ! -x "$APP" ]]; then
            APP="dist/AstroDwarf/AstroDwarf"
          fi
          ASTRO_DWARF_TEST_EXIT_MS=3000 "$APP"

      - name: Build disk image and command-line package
        shell: bash
        run: |
          mkdir -p release dmg-root pkgroot/Applications pkgroot/usr/local/bin
          cp -R dist/AstroDwarf.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Astro Dwarf" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "release/AstroDwarf-${VERSION}-macos-arm64.dmg"
          cp -R dist/AstroDwarf.app pkgroot/Applications/
          install -m 0755 packaging/macos/astro-dwarf pkgroot/usr/local/bin/astro-dwarf
          ln -s astro-dwarf pkgroot/usr/local/bin/AstroDwarf
          pkgbuild \
            --root pkgroot \
            --identifier com.astrodwarf.app \
            --version "${VERSION}" \
            --install-location / \
            "release/AstroDwarf-${VERSION}-macos-arm64.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.pkg
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install system and build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libdrm2 libegl1 libfontconfig1 libgbm1 \
            libgl1 libglib2.0-0 libnss3 libpulse0 libx11-xcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb1 \
            libxkbcommon-x11-0 libxkbcommon0 xvfb zstd
          python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: bash
        run: |
          mkdir -p vendor
          cp "$(command -v ffmpeg)" vendor/ffmpeg
          chmod +x vendor/ffmpeg
          python packaging/build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/astro_dwarf.spec

      - name: Smoke test application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
        run: |
          set -euo pipefail
          timeout 30s env ASTRO_DWARF_TEST_EXIT_MS=3000 dist/AstroDwarf/AstroDwarf

      - name: Build AppImage
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin release
          cp -a dist/AstroDwarf/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/astro-dwarf.desktop AppDir/AstroDwarf.desktop
          sed -i 's/^Exec=.*/Exec=AstroDwarf/' AppDir/AstroDwarf.desktop
          cp packaging/icons/astro-dwarf.png AppDir/astro-dwarf.png
          chmod +x AppDir/AppRun AppDir/usr/bin/AstroDwarf AppDir/usr/bin/AstroDwarfWorker
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "release/AstroDwarf-${VERSION}-linux-x86_64.AppImage"

      - name: Build Debian, RPM, and Arch packages
        shell: bash
        run: |
          sed -i 's/\r$//' packaging/linux/astro-dwarf packaging/linux/AppRun
          chmod +x packaging/linux/astro-dwarf
          curl -fsSL \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager deb \
            --target "release/AstroDwarf-${VERSION}-linux-amd64.deb"
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager rpm \
            --target "release/AstroDwarf-${VERSION}-linux-x86_64.rpm"
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager archlinux \
            --target "release/AstroDwarf-${VERSION}-linux-x86_64.pkg.tar.zst"
          dpkg-deb -c "release/AstroDwarf-${VERSION}-linux-amd64.deb" | grep -E '/usr/bin/(astro-dwarf|AstroDwarf)$'
          tar --use-compress-program=zstd -tf \
            "release/AstroDwarf-${VERSION}-linux-x86_64.pkg.tar.zst" \
            | grep -E '(^|/)usr/bin/(astro-dwarf|AstroDwarf)$'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, windows, macos, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Record version and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --force -B main origin/main
          python packaging/bump_version.py --set "${VERSION}"
          git add VERSION
          if git diff --cached --quiet; then
            echo "VERSION is already ${VERSION}"
          else
            git commit -m "Release ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Astro Dwarf ${{ env.VERSION }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
