name: Build OS installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 1.1.0); leave blank to rebuild VERSION
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - VERSION

concurrency:
  group: installer-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="$(python packaging/bump_version.py --set "${INPUT_VERSION}" --print-only)"
          else
            VERSION="$(python packaging/bump_version.py --print-only)"
          fi
          TAG="v${VERSION}"
          RELEASE=true
          # Automatic VERSION pushes only publish a new, untagged version.
          # workflow_dispatch can rebuild and replace an existing tag.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping duplicate automatic release"
            RELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release version ${VERSION}: ${RELEASE}"

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install build dependencies
        run: python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item (Get-Command ffmpeg).Source vendor\ffmpeg.exe
          python packaging\build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging\astro_dwarf.spec

      - name: Smoke test application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:ASTRO_DWARF_TEST_EXIT_MS = "3000"
          $process = Start-Process dist\AstroDwarf\AstroDwarf.exe -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Frozen application exited with code $($process.ExitCode)."
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\astro-dwarf.iss

      - name: Package Windows zip archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setupExe = "AstroDwarf-Setup-$env:VERSION-win64.exe"
          if (-not (Test-Path "release\$setupExe")) {
            throw "Installer $setupExe was not produced."
          }
          tar.exe -a -c -f "release\AstroDwarf-Setup-$env:VERSION-win64.zip" -C release $setupExe
          tar.exe -a -c -f "release\AstroDwarf-$env:VERSION-win64-portable.zip" -C dist AstroDwarf
          if (-not (Test-Path "release\AstroDwarf-$env:VERSION-win64-portable.zip")) {
            throw "Portable zip was not produced."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple Silicon
            arch: arm64
            python_arch: arm64
          # Last Intel image GitHub publishes. PySide6 is a universal2 wheel;
          # this runner thins the frozen app to x86_64.
          - runner: macos-15-intel
            label: Intel
            arch: x86_64
            python_arch: x64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
      MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install build dependencies
        run: python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: bash
        run: |
          mkdir -p vendor
          cp "$(command -v ffmpeg)" vendor/ffmpeg
          chmod +x vendor/ffmpeg
          python packaging/build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/astro_dwarf.spec

      - name: Smoke test application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
        run: |
          set -euo pipefail
          APP="dist/AstroDwarf.app/Contents/MacOS/AstroDwarf"
          if [[ ! -x "$APP" ]]; then
            APP="dist/AstroDwarf/AstroDwarf"
          fi
          ARCHS="$(lipo -archs "$APP")"
          if [[ "$ARCHS" != "$MAC_ARCH" ]]; then
            echo "Expected a ${MAC_ARCH} executable, lipo reports: ${ARCHS}" >&2
            exit 1
          fi
          ASTRO_DWARF_TEST_EXIT_MS=3000 "$APP"

      - name: Build disk image and command-line package
        shell: bash
        run: |
          mkdir -p release dmg-root pkgroot/Applications pkgroot/usr/local/bin
          cp -R dist/AstroDwarf.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Astro Dwarf" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "release/AstroDwarf-${VERSION}-macos-${MAC_ARCH}.dmg"
          cp -R dist/AstroDwarf.app pkgroot/Applications/
          install -m 0755 packaging/macos/astro-dwarf pkgroot/usr/local/bin/astro-dwarf
          ln -s astro-dwarf pkgroot/usr/local/bin/AstroDwarf
          pkgbuild \
            --root pkgroot \
            --identifier com.astrodwarf.app \
            --version "${VERSION}" \
            --install-location / \
            "release/AstroDwarf-${VERSION}-macos-${MAC_ARCH}.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.pkg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the x64 AppImage on glibc 2.35.
          - runner: ubuntu-22.04
            label: x64
            app_arch: x86_64
            nfpm_arch: amd64
            nfpm_asset: x86_64
            deb_arch: amd64
            pkg_arch: x86_64
          # PySide6's aarch64 wheel needs glibc 2.39, so ARM cannot use 22.04.
          - runner: ubuntu-24.04-arm
            label: ARM64
            app_arch: aarch64
            nfpm_arch: arm64
            nfpm_asset: arm64
            deb_arch: arm64
            pkg_arch: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASTRO_DWARF_VERSION: ${{ needs.version.outputs.version }}
      APP_ARCH: ${{ matrix.app_arch }}
      NFPM_ARCH: ${{ matrix.nfpm_arch }}
      NFPM_ASSET: ${{ matrix.nfpm_asset }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      PKG_ARCH: ${{ matrix.pkg_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1.2.5

      - name: Apply release version
        run: python packaging/bump_version.py --set ${{ env.VERSION }}

      - name: Install system and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Ubuntu 24.04 renamed several libraries with a t64 suffix.
          packages=(
            libasound2 libdbus-1-3 libdrm2 libegl1 libfontconfig1 libgbm1
            libgl1 libglib2.0-0 libnss3 libpulse0 libx11-xcb1 libxcb-cursor0
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb1
            libxkbcommon-x11-0 libxkbcommon0 xvfb zstd file
          )
          # apt-cache show succeeds for a virtual name such as libasound2 on
          # Ubuntu 24.04, and apt-get then refuses it. Candidate: (none)
          # means that name cannot be installed.
          installable() {
            local candidate
            candidate=$(apt-cache policy "$1" | awk '/Candidate:/ {print $2; exit}')
            [ -n "$candidate" ] && [ "$candidate" != "(none)" ]
          }
          install=()
          for pkg in "${packages[@]}"; do
            if installable "$pkg"; then
              install+=("$pkg")
            elif installable "${pkg}t64"; then
              install+=("${pkg}t64")
            else
              echo "No apt package for ${pkg}" >&2
              exit 1
            fi
          done
          sudo apt-get install -y "${install[@]}"
          python -m pip install -e ".[device,build]"

      - name: Verify telescope SDK imports
        run: python -c "import websockets.client; from dwarf_python_api.lib import dwarf_utils"

      - name: Prepare bundled tools and icons
        shell: bash
        run: |
          mkdir -p vendor
          cp "$(command -v ffmpeg)" vendor/ffmpeg
          chmod +x vendor/ffmpeg
          python packaging/build_icons.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/astro_dwarf.spec

      - name: Smoke test application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
        run: |
          set -euo pipefail
          case "$APP_ARCH" in
            x86_64) file dist/AstroDwarf/AstroDwarf | grep -q 'x86-64' ;;
            aarch64) file dist/AstroDwarf/AstroDwarf | grep -q 'aarch64' ;;
            *) echo "Unexpected APP_ARCH ${APP_ARCH}" >&2; exit 1 ;;
          esac
          timeout 30s env ASTRO_DWARF_TEST_EXIT_MS=3000 dist/AstroDwarf/AstroDwarf

      - name: Build AppImage
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor release
          cp -a dist/AstroDwarf/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/astro-dwarf.desktop AppDir/astro-dwarf.desktop
          sed -i 's/^Exec=.*/Exec=AstroDwarf/' AppDir/astro-dwarf.desktop
          cp -a packaging/icons/hicolor/. AppDir/usr/share/icons/hicolor/
          cp packaging/icons/hicolor/256x256/apps/astro-dwarf.png AppDir/astro-dwarf.png
          cp packaging/icons/hicolor/256x256/apps/astro-dwarf.png AppDir/.DirIcon
          chmod +x AppDir/AppRun AppDir/usr/bin/AstroDwarf AppDir/usr/bin/AstroDwarfWorker
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APP_ARCH}.AppImage"
          chmod +x appimagetool
          # Omit "linux" from the filename: every AppImage is for Linux.
          # -u embeds GitHub release update info and writes the .zsync beside the image.
          ARCH="${APP_ARCH}" ./appimagetool --appimage-extract-and-run \
            -u "gh-releases-zsync|styelz|astro_dwarf|latest|AstroDwarf-*-${APP_ARCH}.AppImage.zsync" \
            AppDir \
            "release/AstroDwarf-${VERSION}-${APP_ARCH}.AppImage"

      - name: Build Debian, RPM, and Arch packages
        shell: bash
        run: |
          sed -i 's/\r$//' packaging/linux/astro-dwarf packaging/linux/AppRun packaging/linux/postinstall.sh
          chmod +x packaging/linux/astro-dwarf packaging/linux/postinstall.sh
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${NFPM_ASSET}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager deb \
            --target "release/AstroDwarf-${VERSION}-linux-${DEB_ARCH}.deb"
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager rpm \
            --target "release/AstroDwarf-${VERSION}-linux-${PKG_ARCH}.rpm"
          "$RUNNER_TEMP/nfpm" package \
            --config packaging/linux/nfpm.yaml \
            --packager archlinux \
            --target "release/AstroDwarf-${VERSION}-linux-${PKG_ARCH}.pkg.tar.zst"
          test "$(dpkg-deb -f "release/AstroDwarf-${VERSION}-linux-${DEB_ARCH}.deb" Architecture)" = "$DEB_ARCH"
          dpkg-deb -c "release/AstroDwarf-${VERSION}-linux-${DEB_ARCH}.deb" | grep -E '/usr/bin/(astro-dwarf|AstroDwarf)$'
          dpkg-deb -c "release/AstroDwarf-${VERSION}-linux-${DEB_ARCH}.deb" \
            | grep -E 'usr/share/icons/hicolor/256x256/apps/astro-dwarf.png$'
          dpkg-deb -c "release/AstroDwarf-${VERSION}-linux-${DEB_ARCH}.deb" \
            | grep -E 'usr/share/pixmaps/astro-dwarf.png$'
          tar --use-compress-program=zstd -tf \
            "release/AstroDwarf-${VERSION}-linux-${PKG_ARCH}.pkg.tar.zst" \
            | grep -E '(^|/)usr/bin/(astro-dwarf|AstroDwarf)$'

      - name: Build Flatpak
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' packaging/linux/build-flatpak.sh packaging/linux/flatpak-run.sh
          chmod +x packaging/linux/build-flatpak.sh packaging/linux/flatpak-run.sh
          # Ubuntu 22.04's Flatpak is too old for the current runtime. The
          # container is 24.04 on both runners; the app binary stays the one
          # built above, so the x64 build keeps its older glibc.
          docker run --rm --privileged \
            -e VERSION \
            -e PKG_ARCH \
            -v "$PWD:/src" \
            -w /src \
            ubuntu:24.04 \
            bash packaging/linux/build-flatpak.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers-${{ matrix.app_arch }}
          path: |
            release/*.AppImage
            release/*.AppImage.zsync
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/*.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, windows, macos, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Replace this version if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A newer version keeps every other release. Only the tag being
          # published is replaced, so a workflow_dispatch rebuild can update
          # that one release without removing older versions.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Replacing GitHub release ${TAG}"
            gh release delete "${TAG}" --yes --cleanup-tag
          else
            echo "No existing release for ${TAG}; keeping previous releases"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Deleting leftover tag ${TAG}"
            git push origin --delete "refs/tags/${TAG}"
          fi

      - name: Record version and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --force -B main origin/main
          python packaging/bump_version.py --set "${VERSION}"
          git add VERSION
          if git diff --cached --quiet; then
            echo "VERSION is already ${VERSION}"
          else
            git commit -m "Release ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Write release notes
        run: python packaging/release_body.py --highlights packaging/release_highlights.md --output release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Astro Dwarf ${{ env.VERSION }}
          generate_release_notes: true
          body_path: release-body.md
          files: release/*
          fail_on_unmatched_files: true
