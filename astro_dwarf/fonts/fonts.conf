<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- App-private config. Do not include host /etc/fonts/conf.d — Arch's
       48-guessfamily.conf uses markup the bundled fontconfig cannot parse. -->
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/astro-dwarf-fontconfig</cachedir>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Segoe UI</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Cascadia Mono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Segoe MDL2 Assets</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Astro Dwarf Icons</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Segoe Fluent Icons</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Astro Dwarf Icons</string>
    </edit>
  </match>
</fontconfig>
