name: astro-dwarf
arch: amd64
platform: linux
version: "${VERSION}"
section: science
priority: optional
maintainer: Astro Dwarf
description: Native multi-device Dwarf telescope control and scheduling
homepage: https://github.com/styelz/astro_dwarf
license: Proprietary
archlinux:
  packager: Astro Dwarf
contents:
  - src: dist/AstroDwarf
    dst: /opt/astro-dwarf
    type: tree
  - src: packaging/linux/astro-dwarf
    dst: /usr/bin/astro-dwarf
    file_info:
      mode: 0755
  - src: /usr/bin/astro-dwarf
    dst: /usr/bin/AstroDwarf
    type: symlink
  - src: packaging/linux/astro-dwarf.desktop
    dst: /usr/share/applications/astro-dwarf.desktop
  # Install standard hicolor sizes plus pixmaps so launchers can resolve Icon=astro-dwarf.
  - src: packaging/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: packaging/icons/hicolor/256x256/apps/astro-dwarf.png
    dst: /usr/share/pixmaps/astro-dwarf.png
scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postinstall.sh
