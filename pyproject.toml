[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-dwarf"
version = "1.0.5"
description = "Native multi-device Dwarf telescope control and scheduling"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "requests>=2.32",
]

[project.optional-dependencies]
device = [
  "bleak>=0.22",
  "filelock>=3.15",
  "protobuf>=7.35.1,<8",
  "websockets>=11.0.3,<12",
  "dwarf_python_api @ git+https://github.com/stevejcl/dwarf_python_api",
]
build = [
  "Pillow>=11",
  "pyinstaller>=6.15,<7",
]

[project.scripts]
astro-dwarf = "app:main"

[tool.setuptools]
py-modules = [
  "app",
  "device_worker",
  "domain",
  "qt_backend",
  "runtime",
  "services",
  "storage",
  "stream_preview",
  "version",
]
